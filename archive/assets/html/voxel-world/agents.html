<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Preview</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 42% 28%, #ffffff 0 8%, #eef6f5 34%, #d7e8ee 100%);
    }

    #scene {
      width: 100%;
      height: 100%;
      min-height: 360px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div
    id="scene"
    role="img"
    data-agent="nova"
    data-skins='{"nova":"../../textures/agents/nova.png","milo":"../../textures/agents/milo.png","ares":"../../textures/agents/ares.png"}'
    aria-label="Selected agent rendered with Three.js">
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./agent-viewer.js"></script>
</body>
</html>
